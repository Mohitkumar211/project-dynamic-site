name: Build and Push to ACR

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  id-token: write   # required for OIDC login to Azure
  contents: read

env:
  ACR_NAME: myregistry          # <-- change to your ACR name (no .azurecr.io)
  IMAGE_NAME: dynamic-site

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login (OIDC - no passwords stored)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR (via az, using the OIDC session above)
        run: az acr login --name "${{ env.ACR_NAME }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest
          # This is what safely hands the secret to the Dockerfile's
          # --mount=type=secret,id=build_api_key step. It's injected at
          # build time only and is not persisted in the final image.
          secrets: |
            build_api_key=${{ secrets.BUILD_API_KEY }}

